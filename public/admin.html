<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SK AI 後台管理</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(160deg, #07101f, #120722 52%, #03040a);
        color: #f6fbff;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
      }
      main {
        width: min(100%, 1080px);
        margin: 0 auto;
        padding: 18px;
        display: grid;
        gap: 14px;
      }
      .card {
        border: 1px solid rgba(130, 231, 255, .22);
        border-radius: 18px;
        background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
        box-shadow: 0 18px 50px rgba(0,0,0,.28);
        padding: 16px;
        backdrop-filter: blur(18px);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      h1, h2 {
        margin: 0;
      }
      h1 { font-size: 28px; }
      h2 { font-size: 18px; }
      .muted {
        color: #aebfd1;
        font-size: 13px;
      }
      form {
        display: grid;
        gap: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      input, button {
        min-height: 42px;
        border-radius: 10px;
        font: inherit;
      }
      input {
        width: 100%;
        border: 1px solid rgba(160, 204, 230, .34);
        background: rgba(5, 12, 24, .72);
        color: #fff;
        padding: 0 12px;
      }
      button {
        border: 1px solid rgba(115, 236, 255, .42);
        background: linear-gradient(135deg, #22d7ff, #2affc2);
        color: #061523;
        font-weight: 900;
        cursor: pointer;
      }
      button.secondary {
        background: rgba(255,255,255,.08);
        color: #e9f7ff;
      }
      button.danger {
        border-color: rgba(255, 95, 122, .5);
        background: rgba(255, 67, 96, .16);
        color: #ffc9d2;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 12px;
      }
      th, td {
        border-bottom: 1px solid rgba(255,255,255,.08);
        padding: 10px 8px;
        text-align: left;
        vertical-align: top;
        font-size: 14px;
      }
      th {
        color: #88ecff;
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .actions button {
        min-height: 34px;
        padding: 0 10px;
        font-size: 13px;
      }
      .status {
        display: inline-block;
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 900;
      }
      .status.on {
        color: #072014;
        background: #6effb9;
      }
      .status.off {
        color: #fff;
        background: #b92c46;
      }
      .hidden {
        display: none;
      }
      .message {
        min-height: 22px;
        color: #7df7ff;
        font-size: 13px;
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
        table, thead, tbody, tr, th, td {
          display: block;
        }
        th {
          display: none;
        }
        td {
          padding: 7px 0;
        }
        tr {
          border-bottom: 1px solid rgba(255,255,255,.12);
          padding: 10px 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="loginCard" class="card">
        <h1>SK AI 後台登入</h1>
        <p class="muted">請使用管理員帳號密碼登入。</p>
        <form id="loginForm">
          <input name="username" autocomplete="username" placeholder="帳號" value="koko85830" />
          <input name="password" autocomplete="current-password" type="password" placeholder="密碼" value="er85830" />
          <button type="submit">登入後台</button>
        </form>
        <div id="loginMessage" class="message"></div>
      </section>

      <section id="dashboard" class="hidden">
        <div class="card top">
          <div>
            <h1>SK AI 管理後台</h1>
            <div id="adminInfo" class="muted"></div>
          </div>
          <button id="logoutButton" class="secondary" type="button">登出</button>
        </div>

        <section id="adminCard" class="card hidden">
          <h2>新增管理員</h2>
          <p class="muted">只有 SUPERADMIN 可以建立其他管理員。</p>
          <form id="adminForm" class="grid">
            <input name="username" placeholder="管理員帳號" />
            <input name="password" placeholder="管理員密碼" />
            <button type="submit">新增管理員</button>
          </form>
          <div id="adminMessage" class="message"></div>
          <table>
            <thead><tr><th>帳號</th><th>權限</th><th>狀態</th></tr></thead>
            <tbody id="adminRows"></tbody>
          </table>
        </section>

        <section class="card">
          <h2>新增使用者</h2>
          <p class="muted">建立後會產生一組專屬短書籤安裝連結，可用來驗證外掛權限。</p>
          <form id="userForm" class="grid">
            <input name="name" placeholder="使用者名稱，例如 A" />
            <input name="days" type="number" min="1" value="7" placeholder="可使用天數" />
            <button type="submit">新增使用者</button>
          </form>
          <div id="userMessage" class="message"></div>
        </section>

        <section class="card">
          <h2>使用者列表</h2>
          <table>
            <thead>
              <tr>
                <th>名稱</th>
                <th>狀態</th>
                <th>到期時間</th>
                <th>專屬短書籤安裝連結</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="userRows"></tbody>
          </table>
        </section>
      </section>
    </main>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
